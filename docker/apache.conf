# Apache virtual host for the single-container deployment.
# One server serves both parts of the app:
#   /api/...      -> backend/public/index.php (the PHP REST API)
#   real files    -> served as-is (React build in /assets, product images in /images)
#   anything else -> index.html, so React Router can handle URLs like /product/elden-ring on refresh
<VirtualHost *:__PORT__>
    DocumentRoot __ROOT__
    # Pass the Authorization header through to PHP (needed for "Bearer <token>").
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    <Directory __ROOT__>
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        RewriteEngine On
        RewriteRule ^api(/.*)?$ index.php [L,QSA]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        RewriteRule ^ index.html [L]
    </Directory>

    # Hashed build files can be cached forever; index.html must not be cached.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
