# Render "Blueprint": creates a free PostgreSQL database and the web service in one click.
# Render dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: keyvault-db
    plan: free
    databaseName: keyvault
    user: keyvault

services:
  - type: web
    name: keyvault
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: keyvault-db
          property: connectionString
      - key: APP_DEBUG
        value: "false"
